# Release 发布时构建并上传 PyPI（Trusted Publishing / OIDC，无需 token secret）。
# PyPI 侧需在项目设置 Publishing 中登记本仓库与本 workflow 文件名。
# workflow_dispatch 用于手动补发（按所选分支的 pyproject.toml 版本构建）。

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing 经 OIDC 换取 PyPI 短时凭证
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # 与项目支持范围一致（构建 wheel 不需要安装运行时依赖）
        python-version: '3.12'

    - name: Build package
      run: |
        python -m pip install --upgrade build
        python -m build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
